<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" role="img">
  <title>STM32 电源框图：三大供电区域</title>
  <desc>VDDA 模拟供电区域、VDD 数字供电区域（含 1.8V 区）、VBAT 后备供电区域</desc>
  <rect x="0" y="0" width="680" height="520" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">STM32 电源框图：三大供电区域</text>

  <!-- 顶部：VDDA 模拟供电区域 -->
  <rect x="40" y="60" width="600" height="110" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="10"/>
  <text x="56" y="82" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#0C447C">① VDDA 模拟供电区域</text>
  <text x="420" y="82" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">供电正极 VDDA · 负极 VSSA</text>

  <rect x="56" y="94" width="130" height="58" fill="#FFFFFF" stroke="#185FA5" stroke-width="1" rx="6"/>
  <text x="121" y="116" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle">ADC 转换器</text>
  <text x="121" y="136" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">VREF+/VREF- 在内部</text>
  <text x="121" y="149" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">接到 VDDA/VSSA</text>

  <rect x="200" y="94" width="130" height="58" fill="#FFFFFF" stroke="#185FA5" stroke-width="1" rx="6"/>
  <text x="265" y="116" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle">温度传感器</text>
  <text x="265" y="136" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">复位模块</text>
  <text x="265" y="149" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">PLL 锁相环</text>

  <rect x="344" y="94" width="130" height="58" fill="#FFFFFF" stroke="#185FA5" stroke-width="1" rx="6"/>
  <text x="409" y="116" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle">模拟电路电源</text>
  <text x="409" y="136" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">低电压检测</text>
  <text x="409" y="149" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">上电/掉电复位</text>

  <rect x="488" y="94" width="136" height="58" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" rx="6"/>
  <text x="556" y="116" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">电压检测器</text>
  <text x="556" y="136" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">控制 VBAT 切换开关</text>
  <text x="556" y="149" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">VDD 有电用 VDD</text>

  <!-- 中部：VDD 数字供电区域 -->
  <rect x="40" y="190" width="600" height="170" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="10"/>
  <text x="56" y="212" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3B6D11">② VDD 数字供电区域</text>

  <!-- VDD 子区域 -->
  <rect x="56" y="224" width="250" height="80" fill="#FFFFFF" stroke="#639922" stroke-width="1" rx="6"/>
  <text x="181" y="244" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#3B6D11" text-anchor="middle">VDD 供电区域（3.3V）</text>
  <text x="181" y="266" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">VDD 引脚 / 唤醒逻辑</text>
  <text x="181" y="284" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">独立看门狗 IWDG</text>

  <!-- 电压调节器 -->
  <rect x="330" y="236" width="130" height="52" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="8"/>
  <text x="395" y="258" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#854F0B" text-anchor="middle">电压调节器</text>
  <text x="395" y="276" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">3.3V → 1.8V</text>
  <line x1="306" y1="264" x2="328" y2="264" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="460" y1="264" x2="482" y2="264" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#BA7517"/></marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#BA7517"/></marker>
  </defs>

  <!-- 1.8V 子区域 -->
  <rect x="488" y="224" width="136" height="80" fill="#FFFFFF" stroke="#639922" stroke-width="1" rx="6"/>
  <text x="556" y="244" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#3B6D11" text-anchor="middle">1.8V 供电区域</text>
  <text x="556" y="266" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">CPU 核心</text>
  <text x="556" y="284" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">存储器 + 数字外设</text>

  <!-- 底部说明条 -->
  <rect x="56" y="318" width="568" height="30" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="6"/>
  <text x="340" y="337" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">CPU / 存储器 / 数字外设核心均以 1.8V 低电压运行 → 降低功耗</text>

  <!-- 底部：VBAT 后备供电区域 -->
  <rect x="40" y="380" width="600" height="100" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="10"/>
  <text x="56" y="402" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#3C3489">③ VBAT 后备供电区域（VDD 掉电时供电）</text>
  <rect x="56" y="414" width="130" height="50" fill="#FFFFFF" stroke="#534AB7" stroke-width="1" rx="6"/>
  <text x="121" y="434" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">LSE 32.768kHz</text>
  <text x="121" y="450" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">振荡器</text>
  <rect x="200" y="414" width="130" height="50" fill="#FFFFFF" stroke="#534AB7" stroke-width="1" rx="6"/>
  <text x="265" y="434" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">后备寄存器</text>
  <text x="265" y="450" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">(BKP)</text>
  <rect x="344" y="414" width="130" height="50" fill="#FFFFFF" stroke="#534AB7" stroke-width="1" rx="6"/>
  <text x="409" y="434" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">RCC_BDCR</text>
  <text x="409" y="450" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">备份域控制寄存器</text>
  <rect x="488" y="414" width="136" height="50" fill="#FFFFFF" stroke="#534AB7" stroke-width="1" rx="6"/>
  <text x="556" y="434" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">RTC 实时时钟</text>
  <text x="556" y="450" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">(闹钟可唤醒待机)</text>

  <!-- 脚注 -->
  <text x="40" y="505" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">注：VREF+/VREF- 在 100 脚以上封装单独引出；C8T6（64 脚）内部直接接到 VDDA / VSSA。</text>
</svg>
