<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
  <title>独立看门狗与窗口看门狗知识总结</title>
  <desc>独立看门狗与窗口看门狗对比：时钟来源、写保护、喂狗时机、超时时间、实验关键点，以及记忆口诀</desc>
  <rect x="0" y="0" width="680" height="470" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">P47 知识总结：独立看门狗 vs 窗口看门狗</text>

  <!-- IWDG 列 -->
  <rect x="40" y="60" width="290" height="210" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="10"/>
  <text x="185" y="86" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">独立看门狗 IWDG</text>
  <line x1="60" y1="98" x2="310" y2="98" stroke="#185FA5" stroke-width="1"/>
  <text x="60" y="118" font-family="sans-serif" font-size="10.5" fill="#0C447C">时钟：LSI（40kHz），软件启动后自动开启</text>
  <text x="60" y="136" font-family="sans-serif" font-size="10.5" fill="#0C447C">写保护：有 → 先写 0x5555 解除</text>
  <text x="60" y="154" font-family="sans-serif" font-size="10.5" fill="#0C447C">喂狗时机：超时时间前任意时刻都可以</text>
  <text x="60" y="172" font-family="sans-serif" font-size="10.5" fill="#0C447C">本质：只限制"最晚"，不限制"最早"</text>
  <text x="60" y="196" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">本课参数：÷16、RL=2499、超时 1s</text>
  <text x="60" y="212" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">键值：0x5555 解保护 / 0xAAAA 喂狗 / 0xCCCC 启动</text>
  <text x="60" y="234" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">函数：IWDG_Enable / IWDG_ReloadCounter</text>
  <text x="60" y="252" font-family="sans-serif" font-size="10.5" fill="#A32D2D">复位标志位：RCC_FLAG_IWDGRST</text>

  <!-- WWDG 列 -->
  <rect x="350" y="60" width="290" height="210" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="10"/>
  <text x="495" y="86" font-family="sans-serif" font-size="13" fill="#3B6D11" text-anchor="middle" font-weight="bold">窗口看门狗 WWDG</text>
  <line x1="370" y1="98" x2="620" y2="98" stroke="#639922" stroke-width="1"/>
  <text x="370" y="118" font-family="sans-serif" font-size="10.5" fill="#3B6D11">时钟：PCLK1（APB1，36MHz），需手动开启</text>
  <text x="370" y="136" font-family="sans-serif" font-size="10.5" fill="#3B6D11">写保护：无 → 直接写寄存器</text>
  <text x="370" y="154" font-family="sans-serif" font-size="10.5" fill="#3B6D11">喂狗时机：只能在 [窗口值, 0x40] 的窗口内</text>
  <text x="370" y="172" font-family="sans-serif" font-size="10.5" fill="#3B6D11">本质：太早喂狗复位 + 太晚喂狗复位</text>
  <text x="370" y="196" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">本课参数：÷8、初值 T=118、窗口 W=85</text>
  <text x="370" y="212" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">超时 50ms、窗口 30ms、无键值保护</text>
  <text x="370" y="234" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">函数：WWDG_Enable(初值) / WWDG_SetCounter</text>
  <text x="370" y="252" font-family="sans-serif" font-size="10.5" fill="#A32D2D">复位标志位：RCC_FLAG_WWDGRST</text>

  <!-- 底部口诀 -->
  <rect x="40" y="290" width="600" height="68" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="60" y="312" font-family="sans-serif" font-size="11.5" fill="#5F5E5A" font-weight="bold">核心记忆口诀：</text>
  <text x="60" y="332" font-family="sans-serif" font-size="11" fill="#5F5E5A">独立看门狗：解保护(5555)→写分频重装→启动(CCCC)→循环喂狗(AAAA)，只怕喂得晚</text>
  <text x="60" y="350" font-family="sans-serif" font-size="11" fill="#5F5E5A">窗口看门狗：开时钟→写分频窗口→使能带初值→窗口内喂狗，喂早喂晚都复位</text>

  <!-- 底部结论 -->
  <rect x="40" y="378" width="600" height="70" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="60" y="400" font-family="sans-serif" font-size="11" fill="#A32D2D" font-weight="bold">实验验证要点：</text>
  <text x="60" y="420" font-family="sans-serif" font-size="11" fill="#A32D2D">复位来源判断：RCC_GetFlagStatus(IWDGRST / WWDGRST) + RCC_ClearFlag（不复位自动清！）</text>
  <text x="60" y="438" font-family="sans-serif" font-size="11" fill="#A32D2D">留余量：喂狗间隔不要卡死临界值，受 LSI 误差与代码执行时间影响，实测有偏差属正常</text>
</svg>
