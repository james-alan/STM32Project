<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
  <title>STM32F103C8T6 内部 Flash 基本结构</title>
  <desc>Flash 分为主存储器、系统存储器和选项字节三部分，由 Flash 存储器接口（FPEC 控制器）统一管理擦除和编程</desc>
  <rect x="0" y="0" width="680" height="470" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">STM32F103C8T6 内部 Flash 基本结构图</text>
  <text x="40" y="58" font-family="sans-serif" font-size="11" fill="#5F5E5A">主存储器 = 64KB（64 页 × 1KB）；系统存储器 + 选项字节 = 信息块；右侧是 Flash 的管理员（外设）</text>

  <!-- 主存储器 -->
  <rect x="40" y="90" width="320" height="150" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="200" y="116" font-family="sans-serif" font-size="13" fill="#3B6D11" text-anchor="middle" font-weight="bold">主存储器（程序存储器）</text>
  <text x="200" y="138" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">C8T6：64KB · 64 页 × 1KB</text>
  <text x="200" y="156" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">起始地址 0x0800 0000</text>
  <text x="200" y="176" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">存放程序代码 / 掉电不丢参数</text>
  <text x="200" y="204" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">页地址规律：0x0800 0000 / 0x0400 / 0x0800 … 低 10 位为 0 即页起始</text>
  <text x="200" y="224" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">Flash 容量 64KB 只统计主存储器这一块</text>

  <!-- 信息块 -->
  <rect x="40" y="268" width="320" height="168" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="200" y="292" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="bold">信息块（Information Block）</text>

  <!-- 系统存储器 -->
  <rect x="60" y="306" width="140" height="112" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="6"/>
  <text x="130" y="330" font-family="sans-serif" font-size="11" fill="#3C3489" text-anchor="middle" font-weight="bold">系统存储器</text>
  <text x="130" y="348" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">2KB · 0x1FFF F000</text>
  <text x="130" y="366" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">厂商 Bootloader</text>
  <text x="130" y="382" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">用于串口下载</text>
  <text x="130" y="402" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">出厂写入不可改</text>

  <!-- 选项字节 -->
  <rect x="210" y="306" width="130" height="112" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="275" y="330" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">选项字节</text>
  <text x="275" y="348" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">16B · 0x1FFF F800</text>
  <text x="275" y="366" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">读保护 / 写保护</text>
  <text x="275" y="382" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">独立配置参数</text>
  <text x="275" y="402" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">反码校验机制</text>

  <!-- FPEC 控制器 -->
  <rect x="420" y="90" width="230" height="346" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="535" y="116" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">Flash 存储器接口</text>
  <text x="535" y="136" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle">（外设 · Flash 管理员）</text>
  <text x="535" y="156" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle">即 Flash 编程和擦除控制器</text>
  <text x="535" y="174" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle">FPEC</text>
  <text x="535" y="196" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">寄存器基地址 0x4002 2000</text>
  <text x="535" y="212" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">KEYR 解锁 / CR 控制 / SR 状态</text>
  <text x="535" y="228" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">写 K1+K2 解锁 → 擦除/编程 → 上锁</text>
  <text x="535" y="252" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">可擦除+编程：</text>
  <text x="535" y="270" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">✓ 主存储器　✓ 选项字节</text>
  <text x="535" y="296" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">不可擦除+编程：</text>
  <text x="535" y="314" font-family="sans-serif" font-size="10.5" fill="#A32D2D" text-anchor="middle">✗ 系统存储器（只读）</text>
  <text x="535" y="344" font-family="sans-serif" font-size="10" fill="#0C447C" text-anchor="middle">读取不需要外设：</text>
  <text x="535" y="362" font-family="sans-serif" font-size="10" fill="#0C447C" text-anchor="middle">直接指针读（CPU 挂在总线上）</text>
  <text x="535" y="396" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">读写选项字节可配置</text>
  <text x="535" y="412" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">程序存储器的读保护</text>

  <!-- 箭头 -->
  <line x1="360" y1="140" x2="420" y2="150" stroke="#639922" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="372" y="128" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">擦除/编程</text>
  <line x1="360" y1="360" x2="420" y2="340" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="368" y="356" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">擦除/编程</text>

  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#639922"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BA7517"/>
    </marker>
  </defs>
</svg>
