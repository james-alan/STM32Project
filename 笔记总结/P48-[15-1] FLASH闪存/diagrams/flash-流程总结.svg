<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
  <title>Flash 编程与擦除流程总结</title>
  <desc>编程（半字写入）、页擦除、全擦除三个流程对比：解锁 → 置位 → 触发 → 等待忙</desc>
  <rect x="0" y="0" width="680" height="470" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">Flash 编程与擦除流程总结</text>
  <text x="40" y="58" font-family="sans-serif" font-size="11" fill="#5F5E5A">写前必须擦除；擦除后所有位变为 1（0xFF）；编程只能以半字（16 位）为单位进行</text>

  <!-- 列标题 -->
  <rect x="30" y="80" width="190" height="34" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="125" y="101" font-family="sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" font-weight="bold">编程（写入）</text>
  <rect x="245" y="80" width="190" height="34" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="340" y="101" font-family="sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" font-weight="bold">页擦除</text>
  <rect x="460" y="80" width="190" height="34" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="6"/>
  <text x="555" y="101" font-family="sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" font-weight="bold">全擦除</text>

  <!-- 编程流程 -->
  <rect x="30" y="130" width="190" height="200" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="125" y="156" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">① 解锁（KEYR 写 K1、K2）</text>
  <text x="125" y="184" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">② 置 PG 位 = 1</text>
  <text x="125" y="212" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">③ 指针向目标地址写半字</text>
  <text x="125" y="240" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">（写半字即自动触发，</text>
  <text x="125" y="256" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">无需 STRT）</text>
  <text x="125" y="284" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">④ 等待 BSY = 0</text>
  <text x="125" y="312" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">每次只写 1 个半字，</text>
  <text x="125" y="326" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">多数据需循环调用</text>

  <!-- 页擦除流程 -->
  <rect x="245" y="130" width="190" height="200" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="340" y="156" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">① 解锁（KEYR 写 K1、K2）</text>
  <text x="340" y="184" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">② 置 PER 位 = 1</text>
  <text x="340" y="212" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">③ AR 寄存器写入页起始地址</text>
  <text x="340" y="240" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">④ 置 STRT 位 = 1（触发）</text>
  <text x="340" y="268" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">⑤ 等待 BSY = 0</text>
  <text x="340" y="296" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">芯片根据 AR 指定</text>
  <text x="340" y="310" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">擦除对应那 1 页</text>

  <!-- 全擦除流程 -->
  <rect x="460" y="130" width="190" height="200" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="555" y="156" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">① 解锁（KEYR 写 K1、K2）</text>
  <text x="555" y="184" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">② 置 MER 位 = 1</text>
  <text x="555" y="212" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">③ 置 STRT 位 = 1（触发）</text>
  <text x="555" y="240" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">④ 等待 BSY = 0</text>
  <text x="555" y="268" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">把所有页全部擦除</text>
  <text x="555" y="286" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">信息块不受影响</text>

  <!-- 底部说明 -->
  <rect x="30" y="348" width="620" height="100" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="52" y="372" font-family="sans-serif" font-size="11" fill="#0C447C" font-weight="bold">关键记忆</text>
  <text x="52" y="392" font-family="sans-serif" font-size="10.5" fill="#0C447C">· 解锁：FLASH_KEYR 先写 0x45670123（K1），再写 0xCDEF89AB（K2）；操作完置 LOCK 位重新上锁</text>
  <text x="52" y="410" font-family="sans-serif" font-size="10.5" fill="#0C447C">· 触发：擦除流程靠 STRT 位触发；编程靠"写半字"本身触发，无需 STRT</text>
  <text x="52" y="428" font-family="sans-serif" font-size="10.5" fill="#0C447C">· 等待：所有擦写都要等待状态寄存器 FLASH_SR 的 BSY 位变为 0</text>
  <text x="52" y="442" font-family="sans-serif" font-size="10.5" fill="#A32D2D">· 坑：目标地址未擦除时写入会失败（唯一例外：写入全 0 可以成功）</text>

  <defs>
  </defs>
</svg>
