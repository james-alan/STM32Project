<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
  <title>SPI 外设简化结构图</title>
  <desc>去掉框图无关部分后的简化结构：发送数据寄存器 TDR、接收数据寄存器 RDR、移位寄存器、SCK/MOSI/MISO、波特率发生器、控制逻辑</desc>
  <rect x="0" y="0" width="680" height="400" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">SPI 外设简化结构图（去掉无关部分）</text>
  <text x="40" y="58" font-family="sans-serif" font-size="11" fill="#5F5E5A">核心：发送/接收数据寄存器 + 移位寄存器；发送与接收是两条独立的数据通道</text>

  <!-- 标志位 -->
  <rect x="90" y="80" width="150" height="34" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="165" y="101" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">TXE（TDR 空）</text>
  <rect x="440" y="80" width="150" height="34" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="515" y="101" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">RXNE（RDR 非空）</text>
  <line x1="165" y1="114" x2="165" y2="134" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <line x1="515" y1="114" x2="515" y2="134" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- 发送通道：TDR -> 移位寄存器 -> MOSI -->
  <rect x="60" y="136" width="170" height="60" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="145" y="160" font-family="sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" font-weight="bold">发送数据寄存器 TDR</text>
  <text x="145" y="180" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">软件写入 SPI_DR</text>
  <line x1="230" y1="166" x2="292" y2="166" stroke="#639922" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- 移位寄存器（左移，MSB 先行） -->
  <rect x="294" y="136" width="200" height="60" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="394" y="158" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" font-weight="bold">移位寄存器（左移）</text>
  <text x="394" y="176" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">高位移出 → MOSI，8 次交换 1 字节</text>
  <text x="394" y="190" font-family="sans-serif" font-size="10" fill="#0C447C" text-anchor="middle">（低位先行时则右移）</text>
  <line x1="494" y1="166" x2="540" y2="166" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MOSI 引脚 -->
  <rect x="542" y="150" width="66" height="30" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="5"/>
  <text x="575" y="169" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">MOSI 出</text>

  <!-- MISO 引脚 -->
  <rect x="542" y="252" width="66" height="30" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="5"/>
  <text x="575" y="271" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">MISO 入</text>
  <line x1="542" y1="267" x2="494" y2="267" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 接收通道：MISO -> 移位寄存器 -> RDR -->
  <rect x="294" y="238" width="200" height="60" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="394" y="262" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" font-weight="bold">移位寄存器（共用）</text>
  <text x="394" y="280" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">MISO 数据移入低位</text>
  <line x1="292" y1="268" x2="230" y2="268" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="238" width="170" height="60" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="145" y="262" font-family="sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" font-weight="bold">接收数据寄存器 RDR</text>
  <text x="145" y="280" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">软件读出 SPI_DR</text>

  <!-- 下方：波特率发生器 + 控制逻辑 -->
  <rect x="60" y="330" width="200" height="46" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="160" y="348" font-family="sans-serif" font-size="11.5" fill="#0C447C" text-anchor="middle" font-weight="bold">波特率发生器</text>
  <text x="160" y="366" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">产生 SCK 时钟 → SCK 引脚</text>

  <rect x="290" y="330" width="200" height="46" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="8"/>
  <text x="390" y="348" font-family="sans-serif" font-size="11.5" fill="#3C3489" text-anchor="middle" font-weight="bold">控制逻辑（SPI_CR1）</text>
  <text x="390" y="366" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">像管理员，控制所有电路运行</text>

  <rect x="520" y="330" width="130" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="585" y="348" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">片选 SS</text>
  <text x="585" y="366" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">用 GPIO 模拟</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#185FA5"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#639922"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BA7517"/>
    </marker>
  </defs>
</svg>
