<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="100%" role="img">
  <title>I2C 读寄存器时序</title>
  <desc>I2C read register timing with Repeated Start: Start → Slave Addr+W → ACK → Reg Addr → ACK → Repeated Start → Slave Addr+R → ACK → Data → NACK → Stop</desc>
  <rect x="0" y="0" width="680" height="190" fill="#FAFAFA" rx="12"/>
  
  <text x="340" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">I2C 读寄存器（MCU ← MPU6050）</text>
  
  <text x="340" y="40" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">注意中间的 Repeated Start —— 不停止，直接切换方向</text>
  
  <!-- Phase 1: Send register address -->
  <rect x="20" y="52" width="640" height="58" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-dasharray="4"/>
  <text x="35" y="68" font-family="sans-serif" font-size="10" fill="#0C447C">阶段一: 指定寄存器地址</text>
  
  <!-- Start -->
  <rect x="40" y="75" width="40" height="24" rx="5" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="60" y="91" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A32D2D">S</text>
  
  <line x1="80" y1="87" x2="96" y2="87" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="94,84 98,87 94,90" fill="#D3D1C7"/>
  
  <!-- Addr+W -->
  <rect x="98" y="75" width="72" height="24" rx="5" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="134" y="91" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0C447C">0x68+W</text>
  
  <line x1="170" y1="87" x2="186" y2="87" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="184,84 188,87 184,90" fill="#D3D1C7"/>
  
  <!-- ACK -->
  <rect x="188" y="75" width="40" height="24" rx="5" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="208" y="91" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A32D2D">ACK</text>
  
  <line x1="228" y1="87" x2="244" y2="87" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="242,84 246,87 242,90" fill="#D3D1C7"/>
  
  <!-- Reg -->
  <rect x="246" y="75" width="64" height="24" rx="5" fill="#EAF3DE" stroke="#639922"/>
  <text x="278" y="91" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3B6D11">REG</text>
  
  <line x1="310" y1="87" x2="326" y2="87" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="324,84 328,87 324,90" fill="#D3D1C7"/>
  
  <!-- ACK -->
  <rect x="328" y="75" width="40" height="24" rx="5" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="348" y="91" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A32D2D">ACK</text>
  
  <!-- Phase 2: Read data -->
  <rect x="20" y="118" width="640" height="58" rx="6" fill="#EAF3DE" stroke="#639922" stroke-dasharray="4"/>
  <text x="35" y="134" font-family="sans-serif" font-size="10" fill="#3B6D11">阶段二: 读取数据（方向切换）</text>
  
  <!-- Repeated Start -->
  <rect x="354" y="140" width="64" height="24" rx="5" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="386" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#854F0B">ReStart</text>
  
  <line x1="418" y1="152" x2="434" y2="152" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="432,149 436,152 432,155" fill="#D3D1C7"/>
  
  <!-- Addr+R -->
  <rect x="436" y="140" width="72" height="24" rx="5" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="472" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0C447C">0x68+R</text>
  
  <line x1="508" y1="152" x2="524" y2="152" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="522,149 526,152 522,155" fill="#D3D1C7"/>
  
  <!-- ACK -->
  <rect x="526" y="140" width="40" height="24" rx="5" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="546" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A32D2D">ACK</text>
  
  <line x1="566" y1="152" x2="582" y2="152" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="580,149 584,152 580,155" fill="#D3D1C7"/>
  
  <!-- Data (from slave) -->
  <rect x="70" y="140" width="56" height="24" rx="5" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="98" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3C3489">DATA</text>
  
  <line x1="126" y1="152" x2="142" y2="152" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="140,149 144,152 140,155" fill="#D3D1C7"/>
  
  <!-- NACK -->
  <rect x="144" y="140" width="48" height="24" rx="5" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="168" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A32D2D">NACK</text>
  
  <line x1="192" y1="152" x2="208" y2="152" stroke="#D3D1C7" stroke-width="1"/>
  <polygon points="206,149 210,152 206,155" fill="#D3D1C7"/>
  
  <!-- Stop -->
  <rect x="210" y="140" width="44" height="24" rx="5" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="232" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A32D2D">P</text>
  
  <!-- Label: data from slave -->
  <text x="98" y="172" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#534AB7">← 从机发送</text>
  <text x="168" y="172" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#E24B4A">← 主机应答</text>
  
  <!-- Legend -->
  <rect x="370" y="130" width="280" height="40" rx="6" fill="#F1EFE8" stroke="#D3D1C7"/>
  <text x="390" y="147" font-family="sans-serif" font-size="9" fill="#5F5E5A">蓝=MCU发送 | 紫=从机数据 | 红=应答/停止</text>
  <text x="390" y="161" font-family="sans-serif" font-size="9" fill="#A32D2D">Repeated Start 是读操作的关键：不释放总线，直接切方向</text>
</svg>
