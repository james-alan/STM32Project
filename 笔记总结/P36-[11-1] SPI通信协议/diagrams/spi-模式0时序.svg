<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" role="img">
  <title>SPI 模式0（CPOL=0, CPHA=0）时序图：SS 拉低开始，上升沿移出，下降沿采样</title>
  <desc>SS、SCK、MOSI、MISO 四条线的波形，标注起始/终止、空闲电平、移位边沿与采样边沿</desc>
  <rect x="0" y="0" width="680" height="430" fill="#FAFAFA" rx="12"/>
  <text x="40" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">SPI 模式0 时序（CPOL = 0，CPHA = 0）</text>

  <!-- 坐标区 -->
  <!-- SS 线 -->
  <text x="55" y="88" font-family="sans-serif" font-size="12" fill="#0C447C" font-weight="bold">SS</text>
  <line x1="90" y1="80" x2="620" y2="80" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="80" x2="90" y2="110" stroke="#333333" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="150" y2="110" stroke="#333333" stroke-width="1.5"/>
  <line x1="620" y1="80" x2="620" y2="110" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="110" x2="150" y2="110" stroke="#333333" stroke-width="1.5"/>
  <line x1="150" y1="110" x2="620" y2="110" stroke="#333333" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="150" y2="110" stroke="#E24B4A" stroke-width="2.5"/>
  <text x="120" y="130" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">起始条件（SS 高→低）</text>
  <text x="510" y="130" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">终止条件（SS 低→高）</text>

  <!-- SCK 线 -->
  <text x="52" y="180" font-family="sans-serif" font-size="12" fill="#0C447C" font-weight="bold">SCK</text>
  <line x1="90" y1="172" x2="620" y2="172" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="172" x2="90" y2="202" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="202" x2="620" y2="202" stroke="#333333" stroke-width="1.5"/>
  <!-- 8 个脉冲 -->
  <g stroke="#333333" stroke-width="1.5" fill="none">
    <line x1="150" y1="172" x2="170" y2="172"/><line x1="170" y1="172" x2="170" y2="202"/><line x1="170" y1="202" x2="190" y2="202"/>
    <line x1="190" y1="202" x2="210" y2="202"/><line x1="210" y1="202" x2="210" y2="172"/><line x1="210" y1="172" x2="230" y2="172"/>
    <line x1="230" y1="172" x2="250" y2="172"/><line x1="250" y1="172" x2="250" y2="202"/><line x1="250" y1="202" x2="270" y2="202"/>
    <line x1="270" y1="202" x2="290" y2="202"/><line x1="290" y1="202" x2="290" y2="172"/><line x1="290" y1="172" x2="310" y2="172"/>
    <line x1="310" y1="172" x2="330" y2="172"/><line x1="330" y1="172" x2="330" y2="202"/><line x1="330" y1="202" x2="350" y2="202"/>
    <line x1="350" y1="202" x2="370" y2="202"/><line x1="370" y1="202" x2="370" y2="172"/><line x1="370" y1="172" x2="390" y2="172"/>
    <line x1="390" y1="172" x2="410" y2="172"/><line x1="410" y1="172" x2="410" y2="202"/><line x1="410" y1="202" x2="430" y2="202"/>
    <line x1="430" y1="202" x2="450" y2="202"/><line x1="450" y1="202" x2="450" y2="172"/><line x1="450" y1="172" x2="470" y2="172"/>
    <line x1="470" y1="172" x2="490" y2="172"/><line x1="490" y1="172" x2="490" y2="202"/><line x1="490" y1="202" x2="510" y2="202"/>
    <line x1="510" y1="202" x2="530" y2="202"/><line x1="530" y1="202" x2="530" y2="172"/><line x1="530" y1="172" x2="550" y2="172"/>
    <line x1="550" y1="172" x2="570" y2="172"/><line x1="570" y1="172" x2="570" y2="202"/><line x1="570" y1="202" x2="590" y2="202"/>
    <line x1="590" y1="202" x2="610" y2="202"/><line x1="610" y1="202" x2="610" y2="172"/>
  </g>
  <text x="340" y="218" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle" font-weight="bold">空闲电平 = 低（CPOL=0），8 个时钟位传输 1 字节</text>

  <!-- MOSI 线 -->
  <text x="44" y="268" font-family="sans-serif" font-size="12" fill="#3B6D11" font-weight="bold">MOSI</text>
  <line x1="90" y1="258" x2="620" y2="258" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="258" x2="90" y2="288" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="288" x2="620" y2="288" stroke="#333333" stroke-width="1.5"/>
  <!-- 数据位 B7...B0 每个 40px 宽度 (170-210 等) -->
  <g font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">
    <rect x="170" y="258" width="40" height="30" fill="#EAF3DE"/><text x="190" y="278">B7</text>
    <rect x="250" y="258" width="40" height="30" fill="#EAF3DE"/><text x="270" y="278">B6</text>
    <rect x="330" y="258" width="40" height="30" fill="#EAF3DE"/><text x="350" y="278">B5</text>
    <rect x="410" y="258" width="40" height="30" fill="#EAF3DE"/><text x="430" y="278">B4</text>
    <rect x="490" y="258" width="40" height="30" fill="#EAF3DE"/><text x="510" y="278">B3</text>
  </g>
  <text x="340" y="312" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">主机输出：第一个上升沿移出 B7，之后每个上升沿移出下一位（B6→B0）</text>

  <!-- MISO 线 -->
  <text x="44" y="356" font-family="sans-serif" font-size="12" fill="#3B6D11" font-weight="bold">MISO</text>
  <line x1="90" y1="346" x2="620" y2="346" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="346" x2="90" y2="376" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="376" x2="620" y2="376" stroke="#333333" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">
    <rect x="170" y="346" width="40" height="30" fill="#EAF3DE"/><text x="190" y="366">B7</text>
    <rect x="250" y="346" width="40" height="30" fill="#EAF3DE"/><text x="270" y="366">B6</text>
    <rect x="330" y="346" width="40" height="30" fill="#EAF3DE"/><text x="350" y="366">B5</text>
    <rect x="410" y="346" width="40" height="30" fill="#EAF3DE"/><text x="430" y="366">B4</text>
    <rect x="490" y="346" width="40" height="30" fill="#EAF3DE"/><text x="510" y="366">B3</text>
  </g>
  <text x="340" y="400" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">从机输出：SS 未选中时 MISO 必须高阻态；SS 拉低后允许输出数据</text>
  <text x="340" y="418" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">SS 上升沿后从机 MISO 必须立即切回高阻态，防止多从机冲突</text>
</svg>
