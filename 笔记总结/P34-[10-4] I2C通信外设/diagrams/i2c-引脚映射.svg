<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img">
  <title>STM32 I2C 外设引脚映射</title>
  <desc>I2C1 复用 PB6/PB7（可重映射到 PB8/PB9），I2C2 复用 PB10/PB11；硬件 I2C 引脚固定</desc>
  <rect x="0" y="0" width="680" height="380" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">STM32F103C8T6 硬件 I2C 引脚映射</text>
  <text x="40" y="58" font-family="sans-serif" font-size="11" fill="#5F5E5A">硬件 I2C 引脚在芯片内部已固定 —— 只能用指定引脚，不像软件 I2C 可任意 GPIO</text>

  <!-- I2C1 外设 -->
  <rect x="50" y="100" width="140" height="66" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="120" y="128" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">I2C1 外设</text>
  <text x="120" y="148" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">SCL / SDA</text>

  <!-- I2C2 外设 -->
  <rect x="50" y="250" width="140" height="66" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="120" y="278" font-family="sans-serif" font-size="13" fill="#3B6D11" text-anchor="middle" font-weight="bold">I2C2 外设</text>
  <text x="120" y="298" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">SCL / SDA</text>

  <!-- 芯片 -->
  <rect x="255" y="158" width="160" height="96" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="2" rx="10"/>
  <text x="335" y="196" font-family="sans-serif" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="bold">STM32F103C8T6</text>
  <text x="335" y="216" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">芯片内部已把 I2C 信号</text>
  <text x="335" y="232" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">接到指定 GPIO（复用功能）</text>

  <!-- 连线 I2C1 -> 芯片 -->
  <line x1="190" y1="125" x2="255" y2="190" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="283" x2="255" y2="225" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 引脚区 -->
  <rect x="450" y="76" width="200" height="242" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="550" y="98" font-family="sans-serif" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="bold">PB 引脚（GPIO 复用功能）</text>

  <!-- I2C1 默认 -->
  <rect x="468" y="108" width="164" height="30" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="550" y="127" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" font-weight="bold">PB6 = SCL1　PB7 = SDA1</text>
  <text x="552" y="152" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">（I2C1 默认引脚）</text>

  <!-- I2C1 重映射 -->
  <rect x="468" y="160" width="164" height="30" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="550" y="179" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">PB8 = SCL1　PB9 = SDA1</text>
  <text x="552" y="204" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">（AFIO 重映射 REMAP）</text>

  <!-- I2C2 -->
  <rect x="468" y="212" width="164" height="30" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="550" y="231" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" font-weight="bold">PB10 = SCL2　PB11 = SDA2</text>
  <text x="552" y="256" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">（I2C2 引脚）</text>

  <!-- 连线 芯片 -> 引脚 -->
  <line x1="415" y1="196" x2="468" y2="122" stroke="#639922" stroke-width="1.5"/>
  <line x1="415" y1="206" x2="468" y2="176" stroke="#BA7517" stroke-width="1.5"/>
  <line x1="415" y1="216" x2="468" y2="228" stroke="#639922" stroke-width="1.5"/>

  <!-- 底部说明 -->
  <rect x="50" y="330" width="600" height="36" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="70" y="352" font-family="sans-serif" font-size="11" fill="#A32D2D" font-weight="bold">注意：若 PB6/PB7 已被占用（如被 I2C 或别的外设使用），才用 AFIO 重映射到 PB8/PB9 —— 查手册引脚复用表确定</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#185FA5"/>
    </marker>
  </defs>
</svg>
