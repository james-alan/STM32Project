<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
  <title>I2C 外设内部结构框图</title>
  <desc>STM32 硬件 I2C 外设结构：SCL/SDA 引脚、移位寄存器、数据寄存器 DR、TXE/RXNE 标志、时钟控制、地址比较器、PEC 校验</desc>
  <rect x="0" y="0" width="680" height="470" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">STM32 I2C 外设内部结构框图</text>
  <text x="40" y="58" font-family="sans-serif" font-size="11" fill="#5F5E5A">核心：数据寄存器 DR 与移位寄存器两级配合 —— 与串口（USART）的数据收发原理同出一辙</text>

  <!-- 标志位 -->
  <rect x="90" y="80" width="150" height="36" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="165" y="103" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">TXE = 发送寄存器空</text>
  <rect x="270" y="80" width="160" height="36" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="350" y="103" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">RXNE = 接收寄存器非空</text>
  <line x1="165" y1="116" x2="165" y2="138" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="116" x2="350" y2="138" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 移位寄存器 -->
  <rect x="90" y="140" width="240" height="78" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="210" y="168" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">移位寄存器</text>
  <text x="210" y="188" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">高位先行，SCL 每 1 个时钟移 1 位</text>
  <text x="210" y="204" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">8 次移位完成 1 个字节</text>

  <!-- 数据寄存器 DR -->
  <rect x="400" y="140" width="210" height="78" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="505" y="168" font-family="sans-serif" font-size="13" fill="#3B6D11" text-anchor="middle" font-weight="bold">数据寄存器 DR</text>
  <text x="505" y="188" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">软件写入 → 发数据</text>
  <text x="505" y="204" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">软件读出 → 收数据</text>

  <!-- 双向箭头 DR <-> 移位寄存器 -->
  <line x1="330" y1="160" x2="400" y2="160" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="198" x2="330" y2="198" stroke="#639922" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="365" y="152" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">发送: DR→移位</text>
  <text x="365" y="224" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">接收: 移位→DR</text>

  <!-- SCL SDA 引脚 -->
  <rect x="28" y="150" width="50" height="26" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="5"/>
  <text x="53" y="167" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">SCL</text>
  <rect x="28" y="184" width="50" height="26" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="5"/>
  <text x="53" y="201" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">SDA</text>
  <line x1="78" y1="163" x2="90" y2="163" stroke="#D3D1C7" stroke-width="1.5"/>
  <line x1="78" y1="197" x2="90" y2="197" stroke="#D3D1C7" stroke-width="1.5"/>
  <text x="53" y="240" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">接 GPIO</text>
  <text x="53" y="253" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">复用开漏</text>

  <!-- 下方模块 -->
  <rect x="60" y="300" width="180" height="66" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="150" y="326" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" font-weight="bold">时钟控制</text>
  <text x="150" y="344" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">产生 SCL 时序、起始/停止</text>
  <text x="150" y="358" font-family="sans-serif" font-size="10.5" fill="#0C447C" text-anchor="middle">写 CCR 配置速率</text>
  <line x1="150" y1="300" x2="150" y2="272" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="300" width="190" height="66" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="8"/>
  <text x="365" y="326" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="bold">地址比较器 + 自身地址寄存器</text>
  <text x="365" y="344" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">从机模式才使用</text>
  <text x="365" y="358" font-family="sans-serif" font-size="10.5" fill="#A32D2D" text-anchor="middle">本课（一主一从）不涉及</text>

  <rect x="490" y="300" width="160" height="66" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="570" y="326" font-family="sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" font-weight="bold">PEC 错误校验</text>
  <text x="570" y="344" font-family="sans-serif" font-size="10.5" fill="#A32D2D" text-anchor="middle">硬件自动计算/判定</text>
  <text x="570" y="358" font-family="sans-serif" font-size="10.5" fill="#A32D2D" text-anchor="middle">了解即可</text>

  <!-- 底部说明 -->
  <rect x="60" y="396" width="590" height="54" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="80" y="418" font-family="sans-serif" font-size="11" fill="#5F5E5A">操作方式（开车类比）：</text>
  <text x="80" y="436" font-family="sans-serif" font-size="11" fill="#5F5E5A">写入控制寄存器 CR = 踩油门打方向盘（控制运行）　读取状态寄存器 SR = 看仪表盘（了解状态）　DR = 装货卸货的货舱</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#185FA5"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#639922"/>
    </marker>
  </defs>
</svg>
