<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" role="img">
  <title>I2C 复合格式帧</title>
  <desc>Start → Addr+W → ACK → RegAddr → ACK → Start → Addr+R → ACK → Data → ACK → Stop</desc>

  <rect x="0" y="0" width="680" height="220" fill="#FAFAFA" rx="12"/>
  <text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">复合格式 — 先写寄存器地址再读数据</text>

  <g font-family="sans-serif" text-anchor="middle">
    <!-- Start 1 -->
    <rect x="8" y="55" width="48" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="32" y="73" font-size="10" font-weight="500" fill="#0C447C">Start</text>

    <!-- Addr+W -->
    <rect x="62" y="55" width="88" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="106" y="73" font-size="9" font-weight="500" fill="#534AB7">地址+W</text>

    <!-- ACK -->
    <rect x="156" y="55" width="44" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text x="178" y="73" font-size="9" fill="#3B6D11">ACK</text>

    <!-- RegAddr -->
    <rect x="206" y="55" width="88" height="28" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
    <text x="250" y="73" font-size="9" font-weight="500" fill="#72243E">寄存器地址</text>

    <!-- ACK -->
    <rect x="300" y="55" width="44" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text x="322" y="73" font-size="9" fill="#3B6D11">ACK</text>

    <!-- Repeated Start -->
    <rect x="350" y="55" width="56" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="378" y="73" font-size="8" font-weight="500" fill="#185FA5">ReStart</text>

    <!-- Addr+R -->
    <rect x="412" y="55" width="88" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="456" y="73" font-size="9" font-weight="500" fill="#534AB7">地址+R</text>

    <!-- ACK -->
    <rect x="506" y="55" width="44" height="28" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text x="528" y="73" font-size="9" fill="#3B6D11">ACK</text>

    <!-- Data -->
    <rect x="556" y="55" width="56" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="584" y="73" font-size="9" font-weight="500" fill="#854F0B">数据</text>

    <!-- Stop -->
    <rect x="618" y="55" width="48" height="28" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="642" y="73" font-size="10" font-weight="500" fill="#993C1D">Stop</text>
  </g>

  <g stroke="#888780" stroke-width="1.2" fill="none">
    <line x1="56" y1="69" x2="62" y2="69"/>
    <line x1="150" y1="69" x2="156" y2="69"/>
    <line x1="200" y1="69" x2="206" y2="69"/>
    <line x1="294" y1="69" x2="300" y2="69"/>
    <line x1="344" y1="69" x2="350" y2="69"/>
    <line x1="406" y1="69" x2="412" y2="69"/>
    <line x1="500" y1="69" x2="506" y2="69"/>
    <line x1="550" y1="69" x2="556" y2="69"/>
    <line x1="612" y1="69" x2="618" y2="69"/>
  </g>

  <text x="340" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">第一阶段：指定寄存器（写操作） | 第二阶段：读数据</text>

  <rect x="120" y="128" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#534AB7">注意：第二个起始条件 (Repeated Start) 之后没有 Stop！</text>
  <text x="340" y="162" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">这保证了整个操作期间总线不会被释放，避免其他主机插入</text>
  <text x="340" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">典型应用：EEPROM 写入/读取、传感器寄存器读写</text>
</svg>