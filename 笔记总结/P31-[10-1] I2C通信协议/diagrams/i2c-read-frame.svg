<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" role="img">
  <title>I2C 指定地址读帧格式</title>
  <desc>起始 → 地址+R → ACK → 数据1(从机发) → ACK → ... → NACK → 停止</desc>

  <rect x="0" y="0" width="680" height="260" fill="#FAFAFA" rx="12"/>
  <text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">指定地址读 — 主机收，从机发</text>

  <g font-family="sans-serif" text-anchor="middle">
    <!-- Start -->
    <rect x="10" y="55" width="60" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="40" y="75" font-size="11" font-weight="500" fill="#0C447C">Start</text>

    <!-- Address + R -->
    <rect x="78" y="55" width="120" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="138" y="72" font-size="10" font-weight="500" fill="#534AB7">从机地址(7bit)</text>
    <text x="138" y="83" font-size="9" fill="#534AB7">+ R=1</text>

    <!-- ACK from slave -->
    <rect x="206" y="55" width="60" height="32" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text x="236" y="72" font-size="10" font-weight="500" fill="#3B6D11">ACK</text>
    <text x="236" y="83" font-size="8" fill="#639922">从机应答</text>

    <!-- Data 1 from slave -->
    <rect x="274" y="55" width="92" height="32" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="320" y="72" font-size="10" font-weight="500" fill="#854F0B">数据1</text>
    <text x="320" y="83" font-size="8" fill="#BA7517">从机发送</text>

    <!-- ACK from master -->
    <rect x="374" y="55" width="64" height="32" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text x="406" y="72" font-size="10" font-weight="500" fill="#3B6D11">ACK</text>
    <text x="406" y="83" font-size="8" fill="#639922">主机应答</text>

    <!-- Data 2 ... -->
    <rect x="446" y="55" width="72" height="32" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8" stroke-dasharray="4,2"/>
    <text x="482" y="72" font-size="10" font-weight="500" fill="#854F0B">数据2</text>
    <text x="482" y="83" font-size="8" fill="#BA7517">...</text>

    <!-- NACK -->
    <rect x="526" y="55" width="64" height="32" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
    <text x="558" y="72" font-size="10" font-weight="500" fill="#A32D2D">NACK</text>
    <text x="558" y="83" font-size="8" fill="#A32D2D">主机拒收</text>

    <!-- Stop -->
    <rect x="598" y="55" width="60" height="32" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="628" y="75" font-size="11" font-weight="500" fill="#993C1D">Stop</text>
  </g>

  <g stroke="#888780" stroke-width="1.2" fill="none">
    <line x1="70" y1="71" x2="78" y2="71"/>
    <line x1="198" y1="71" x2="206" y2="71"/>
    <line x1="266" y1="71" x2="274" y2="71"/>
    <line x1="366" y1="71" x2="374" y2="71"/>
    <line x1="438" y1="71" x2="446" y2="71"/>
    <line x1="518" y1="71" x2="526" y2="71"/>
    <line x1="590" y1="71" x2="598" y2="71"/>
  </g>

  <text x="340" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">蓝色=主机发送 | 黄色=从机发送 | 绿色=应答 | 红色=主机拒收</text>

  <g font-family="sans-serif" font-size="10" fill="#5F5E5A">
    <text x="340" y="143" text-anchor="middle">1. 主机发 Start + 地址 + R=1</text>
    <text x="340" y="160" text-anchor="middle">2. 从机 ACK 后，SDA 控制权转移给从机</text>
    <text x="340" y="177" text-anchor="middle">3. 从机逐字节发送数据，主机应答 ACK 表示继续收</text>
    <text x="340" y="194" text-anchor="middle">4. 主机发 NACK 表示"不收了下一位"</text>
    <text x="340" y="211" text-anchor="middle">5. 主机发 Stop → 释放总线</text>
  </g>
</svg>