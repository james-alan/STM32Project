<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" width="100%" role="img">
  <title>硬件 I2C 主机接收流程（读寄存器）</title>
  <desc>硬件 I2C 读寄存器：起始→EV5→发地址+写→EV6→发寄存器地址→EV8_2→重复起始→EV5→发地址+读→EV6→提前 ACK=0+STOP→EV7→读 DR</desc>
  <rect x="0" y="0" width="680" height="760" fill="#FAFAFA" rx="12"/>
  <text x="40" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">硬件 I2C 主机接收流程 —— 读 MPU6050 寄存器（对照手册主机接收时序图）</text>
  <text x="40" y="56" font-family="sans-serif" font-size="11" fill="#5F5E5A">前半段与发送相同：指定寄存器地址后，用 Repeated Start 切换方向再读</text>

  <!-- 阶段 A -->
  <rect x="40" y="74" width="600" height="26" fill="#185FA5" rx="6"/>
  <text x="60" y="92" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">阶段一：告知从机要读哪个寄存器（与发送流程完全相同）</text>

  <rect x="40" y="112" width="350" height="46" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="60" y="133" font-family="sans-serif" font-size="11" fill="#0C447C" font-weight="bold">① START → 等待 EV5</text>
  <text x="60" y="149" font-family="sans-serif" font-size="10" fill="#0C447C">I2C_GenerateSTART + CheckEvent(MASTER_MODE_SELECT)</text>
  <rect x="430" y="112" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="133" font-family="sans-serif" font-size="10" fill="#5F5E5A">发送地址+写位</text>
  <text x="446" y="149" font-family="sans-serif" font-size="10" fill="#5F5E5A">Send7bitAddress(Addr, I2C_Direction_Transmitter)</text>

  <rect x="40" y="170" width="350" height="46" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="8"/>
  <text x="60" y="191" font-family="sans-serif" font-size="11" fill="#854F0B" font-weight="bold">② 等待 EV6（发送模式）</text>
  <text x="60" y="207" font-family="sans-serif" font-size="10" fill="#854F0B">I2C_EVENT_MASTER_TRANSMITTER_MODE_SELECTED</text>
  <rect x="430" y="170" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="191" font-family="sans-serif" font-size="10" fill="#5F5E5A">发送寄存器地址</text>
  <text x="446" y="207" font-family="sans-serif" font-size="10" fill="#5F5E5A">I2C_SendData(I2C2, RegAddr)</text>

  <rect x="40" y="228" width="350" height="46" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="8"/>
  <text x="60" y="249" font-family="sans-serif" font-size="11" fill="#3C3489" font-weight="bold">③ 等待 EV8_2（最后一个字节）</text>
  <text x="60" y="265" font-family="sans-serif" font-size="10" fill="#3C3489">BYTE_TRANSMITTED：寄存器地址已发完</text>
  <rect x="430" y="228" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="249" font-family="sans-serif" font-size="10" fill="#5F5E5A">等待 BTF：地址波形真正发完</text>
  <text x="446" y="265" font-family="sans-serif" font-size="10" fill="#5F5E5A">再产生 Repeated Start 更稳妥</text>

  <!-- 阶段 B -->
  <rect x="40" y="292" width="600" height="26" fill="#639922" rx="6"/>
  <text x="60" y="310" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">阶段二：Repeated Start 切换方向，读取数据（注意读方向事件名不同）</text>

  <rect x="40" y="330" width="350" height="46" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="60" y="351" font-family="sans-serif" font-size="11" fill="#3B6D11" font-weight="bold">④ Repeated Start → 等待 EV5</text>
  <text x="60" y="367" font-family="sans-serif" font-size="10" fill="#3B6D11">再调 I2C_GenerateSTART（两个 START 间无 STOP）</text>
  <rect x="430" y="330" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="351" font-family="sans-serif" font-size="10" fill="#5F5E5A">若上一个字节还在发，硬件会</text>
  <text x="446" y="367" font-family="sans-serif" font-size="10" fill="#5F5E5A">自动等发完再产生起始</text>

  <rect x="40" y="388" width="350" height="46" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="60" y="409" font-family="sans-serif" font-size="11" fill="#3B6D11" font-weight="bold">⑤ Send7bitAddress(Addr, I2C_Direction_Receiver)</text>
  <text x="60" y="425" font-family="sans-serif" font-size="10" fill="#3B6D11">地址最低位置 1 → 读方向，硬件自动完成</text>
  <rect x="430" y="388" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="409" font-family="sans-serif" font-size="10" fill="#5F5E5A">方向宏会替我们把 bit0 置 1</text>
  <text x="446" y="425" font-family="sans-serif" font-size="10" fill="#5F5E5A">不用手动 OR 0x01</text>

  <rect x="40" y="446" width="350" height="46" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="8"/>
  <text x="60" y="467" font-family="sans-serif" font-size="11" fill="#854F0B" font-weight="bold">⑥ 等待 EV6（接收模式）</text>
  <text x="60" y="483" font-family="sans-serif" font-size="10" fill="#854F0B">I2C_EVENT_MASTER_RECEIVER_MODE_SELECTED ⚠</text>
  <rect x="430" y="446" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="467" font-family="sans-serif" font-size="10" fill="#5F5E5A">与发送模式 EV6 宏名不同！</text>
  <text x="446" y="483" font-family="sans-serif" font-size="10" fill="#5F5E5A">注意 RECEIVER 关键词</text>

  <!-- 关键一步 -->
  <rect x="40" y="512" width="600" height="78" fill="#FAEEDA" stroke="#BA7517" stroke-width="2" rx="8"/>
  <text x="60" y="534" font-family="sans-serif" font-size="12" fill="#854F0B" font-weight="bold">⑦ 读最后一个字节之前 → 必须提前配置 ACK 与 STOP</text>
  <text x="60" y="554" font-family="sans-serif" font-size="10.5" fill="#854F0B">I2C_AcknowledgeConfig(I2C2, DISABLE)   ← ACK=0（读完后回 NACK 告诉从机"够了"）</text>
  <text x="60" y="572" font-family="sans-serif" font-size="10.5" fill="#854F0B">I2C_GenerateSTOP(I2C2, ENABLE)          ← 提前置停止位（不会打断当前字节，等收完才停）</text>
  <text x="60" y="590" font-family="sans-serif" font-size="10" fill="#854F0B" font-style="italic">为什么？应答是在每个字节接收时同步发出的，等数据收完再改 ACK 就晚了（会多出一个字节）</text>

  <rect x="40" y="602" width="350" height="46" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="8"/>
  <text x="60" y="623" font-family="sans-serif" font-size="11" fill="#3C3489" font-weight="bold">⑧ 等待 EV7：MASTER_RECEIVE_BYTE_RECEIVED</text>
  <text x="60" y="639" font-family="sans-serif" font-size="10" fill="#3C3489">RXNE=1：一个字节已收到，存入 DR</text>
  <rect x="430" y="602" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="623" font-family="sans-serif" font-size="10" fill="#5F5E5A">EV7 无标志位可查，必须用</text>
  <text x="446" y="639" font-family="sans-serif" font-size="10" fill="#5F5E5A">I2C_CheckEvent 组合事件判断</text>

  <rect x="40" y="660" width="350" height="46" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="60" y="681" font-family="sans-serif" font-size="11" fill="#3B6D11" font-weight="bold">⑨ Data = I2C_ReceiveData(I2C2)</text>
  <text x="60" y="697" font-family="sans-serif" font-size="10" fill="#3B6D11">读 DR 取回数据（RXNE 自动清除）</text>
  <rect x="430" y="660" width="210" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" rx="8"/>
  <text x="446" y="681" font-family="sans-serif" font-size="10" fill="#5F5E5A">最后恢复 ACK=ENABLE</text>
  <text x="446" y="697" font-family="sans-serif" font-size="10" fill="#5F5E5A">方便后续扩展读多个字节</text>

  <text x="40" y="740" font-family="sans-serif" font-size="10.5" fill="#3C3489" font-weight="bold">扩展：读多字节 → 把 ⑤⑧⑨ 放入循环，最后一个字节前 if(最后一个) 提前 ACK=0+STOP</text>
</svg>
