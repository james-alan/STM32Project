<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="100%" role="img">
  <title>P37 W25Q64 简介知识总结</title>
  <desc>芯片特性、存储结构、内部框图重点、Flash 读写注意事项、核心指令集与记忆口诀</desc>
  <rect x="0" y="0" width="680" height="560" fill="#FAFAFA" rx="12"/>
  <text x="40" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">P37 知识总结：W25Q64（SPI 接口 NOR Flash，8MB）</text>

  <!-- ① 芯片特性 -->
  <rect x="40" y="54" width="190" height="150" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <rect x="40" y="54" width="190" height="30" fill="#185FA5" rx="10"/>
  <rect x="40" y="74" width="190" height="10" fill="#185FA5"/>
  <text x="135" y="74" font-family="sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">① 芯片特性</text>
  <text x="56" y="106" font-family="sans-serif" font-size="11" fill="#0C447C" font-weight="bold">低成本</text>
  <text x="56" y="122" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">几块钱，容量达兆字节级</text>
  <text x="56" y="142" font-family="sans-serif" font-size="11" fill="#0C447C" font-weight="bold">小型化</text>
  <text x="56" y="158" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">贴片小封装，省 PCB 空间</text>
  <text x="56" y="178" font-family="sans-serif" font-size="11" fill="#0C447C" font-weight="bold">使用简单</text>
  <text x="56" y="194" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">SPI 引脚少、外围电路少</text>

  <!-- ② 存储结构 -->
  <rect x="245" y="54" width="190" height="150" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <rect x="245" y="54" width="190" height="30" fill="#639922" rx="10"/>
  <rect x="245" y="74" width="190" height="10" fill="#639922"/>
  <text x="340" y="74" font-family="sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">② 存储结构</text>
  <text x="261" y="104" font-family="sans-serif" font-size="11" fill="#3B6D11" font-weight="bold">整片 = 8MB</text>
  <text x="261" y="122" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">24 位地址（3 字节）只用一半</text>
  <text x="261" y="146" font-family="sans-serif" font-size="11" fill="#3B6D11" font-weight="bold">块 Block = 64KB × 128</text>
  <text x="261" y="164" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">扇区 Sector = 4KB × 16/块</text>
  <text x="261" y="182" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">页 Page = 256B × 16/扇区</text>
  <text x="261" y="198" font-family="sans-serif" font-size="10" fill="#A32D2D">最小擦除单元 = 扇区 4KB</text>

  <!-- ③ 内部框图重点 -->
  <rect x="450" y="54" width="190" height="150" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <rect x="450" y="54" width="190" height="30" fill="#534AB7" rx="10"/>
  <rect x="450" y="74" width="190" height="10" fill="#534AB7"/>
  <text x="545" y="74" font-family="sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">③ 内部框图重点</text>
  <text x="466" y="106" font-family="sans-serif" font-size="11" fill="#3C3489" font-weight="bold">SPI 控制逻辑</text>
  <text x="466" y="122" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">＝芯片管理员，读写作废都靠它</text>
  <text x="466" y="142" font-family="sans-serif" font-size="11" fill="#3C3489" font-weight="bold">状态寄存器</text>
  <text x="466" y="158" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">BUSY / WEL / 写保护</text>
  <text x="466" y="178" font-family="sans-serif" font-size="11" fill="#3C3489" font-weight="bold">256B 页缓存</text>
  <text x="466" y="194" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">限制单次写≤256B，写完要搬</text>

  <!-- ④ 写入注意事项 -->
  <rect x="40" y="220" width="300" height="150" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <rect x="40" y="220" width="300" height="30" fill="#E24B4A" rx="10"/>
  <rect x="40" y="240" width="300" height="10" fill="#E24B4A"/>
  <text x="190" y="240" font-family="sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">④ 写入操作 6 大注意事项</text>
  <text x="56" y="268" font-family="sans-serif" font-size="10.5" fill="#A32D2D">1. 写入前必须先写使能（先解锁再操作）</text>
  <text x="56" y="286" font-family="sans-serif" font-size="10.5" fill="#A32D2D">2. 每个数据位只能 1→0，不能 0→1</text>
  <text x="56" y="304" font-family="sans-serif" font-size="10.5" fill="#A32D2D">3. 写入前必须先擦除（擦除后全变 FF）</text>
  <text x="56" y="322" font-family="sans-serif" font-size="10.5" fill="#A32D2D">4. 擦除按最小单元：扇区 4KB 一起擦</text>
  <text x="56" y="340" font-family="sans-serif" font-size="10.5" fill="#A32D2D">5. 多字节写最多 1 页（256B），超页回绕</text>
  <text x="56" y="358" font-family="sans-serif" font-size="10.5" fill="#A32D2D">6. 写 / 擦除结束后进入忙状态，需等 BUSY=0</text>

  <!-- ⑤ 读取注意事项 -->
  <rect x="356" y="220" width="284" height="150" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <rect x="356" y="220" width="284" height="30" fill="#BA7517" rx="10"/>
  <rect x="356" y="240" width="284" height="10" fill="#BA7517"/>
  <text x="498" y="240" font-family="sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">⑤ 读取操作（宽松很多）</text>
  <text x="372" y="268" font-family="sans-serif" font-size="10.5" fill="#854F0B">• 直接调用读取时序，无需写使能</text>
  <text x="372" y="286" font-family="sans-serif" font-size="10.5" fill="#854F0B">• 没有页的限制，想读多少读多少</text>
  <text x="372" y="304" font-family="sans-serif" font-size="10.5" fill="#854F0B">• 读后不会进入忙状态</text>
  <text x="372" y="322" font-family="sans-serif" font-size="10.5" fill="#A32D2D">• 但不能在忙状态下读（先等 BUSY=0）</text>
  <text x="372" y="346" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">原因：读只是看电路状态，不改变电路</text>
  <text x="372" y="362" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">→ 速度快、无限制</text>

  <!-- ⑥ 核心指令集 -->
  <rect x="40" y="386" width="600" height="94" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <rect x="40" y="386" width="600" height="30" fill="#185FA5" rx="10"/>
  <rect x="40" y="406" width="600" height="10" fill="#185FA5"/>
  <text x="340" y="406" font-family="sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">⑥ 核心指令集（先学这 6~7 条）</text>
  <text x="56" y="438" font-family="sans-serif" font-size="10.5" fill="#0C447C">06 写使能 ｜ 04 写禁用 ｜ 05 读状态寄存器1（查 BUSY/WEL）</text>
  <text x="56" y="456" font-family="sans-serif" font-size="10.5" fill="#0C447C">02 页编程（写数据，≤256B）｜ 20 扇区擦除（发 3 字节地址）</text>
  <text x="56" y="474" font-family="sans-serif" font-size="10.5" fill="#0C447C">03 读数据（无页限制）｜ 9F 读 JEDEC ID（厂商 0xEF + 设备 ID）</text>

  <!-- 口诀 -->
  <rect x="40" y="496" width="600" height="46" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="60" y="516" font-family="sans-serif" font-size="11.5" fill="#5F5E5A" font-weight="bold">核心记忆口诀：</text>
  <text x="60" y="534" font-family="sans-serif" font-size="11" fill="#5F5E5A">写入先使能 → 写前必擦除 → 只能 1 改 0 → 擦除按扇区 → 写读不超页 → 写完等不忙 → 读数据随便读</text>
</svg>
