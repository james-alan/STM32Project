<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="100%" role="img">
  <title>W25Q64 存储结构：块 Block → 扇区 Sector → 页 Page</title>
  <desc>8MB 存储空间先按 64KB 划为 128 块，每块按 4KB 划为 16 扇区，每扇区按 256B 划为 16 页，并给出 24 位地址分解</desc>
  <rect x="0" y="0" width="680" height="560" fill="#FAFAFA" rx="12"/>
  <text x="40" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">W25Q64 存储结构：块（Block）→ 扇区（Sector）→ 页（Page）</text>

  <!-- 第 1 层：整片 -->
  <rect x="40" y="54" width="600" height="54" fill="#E6F1FB" stroke="#185FA5" stroke-width="2" rx="10"/>
  <text x="340" y="76" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">W25Q64 整片存储空间 = 8MB</text>
  <text x="340" y="96" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle">24 位地址最大可寻址 16MB（0x000000 ~ 0xFFFFFF），本芯片只用前半 8MB：0x000000 ~ 0x7FFFFF</text>

  <!-- 箭头 -->
  <line x1="340" y1="108" x2="340" y2="134" stroke="#185FA5" stroke-width="1.5"/>
  <polygon points="340,142 334,132 346,132" fill="#185FA5"/>

  <!-- 第 2 层：块 -->
  <rect x="40" y="144" width="600" height="66" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <text x="340" y="166" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="bold">以 64KB 为一个基本单元 → 共 8MB ÷ 64KB = 128 块（Block0 ~ Block127）</text>
  <rect x="60" y="176" width="76" height="26" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="5"/>
  <text x="98" y="193" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">Block0</text>
  <rect x="146" y="176" width="76" height="26" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="5"/>
  <text x="184" y="193" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">Block1</text>
  <rect x="232" y="176" width="76" height="26" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="5"/>
  <text x="270" y="193" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">Block2</text>
  <text x="330" y="193" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">…</text>
  <rect x="352" y="176" width="90" height="26" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="5"/>
  <text x="397" y="193" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">Block126</text>
  <rect x="452" y="176" width="90" height="26" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="5"/>
  <text x="497" y="193" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">Block127</text>
  <text x="580" y="188" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">每块 64KB</text>
  <text x="580" y="201" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">每块地址只变低 2 字节</text>

  <!-- 箭头 -->
  <line x1="497" y1="210" x2="497" y2="236" stroke="#185FA5" stroke-width="1.5"/>
  <polygon points="497,244 491,234 503,234" fill="#185FA5"/>

  <!-- 第 3 层：扇区 -->
  <rect x="40" y="246" width="600" height="66" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <text x="340" y="268" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="bold">每个块（64KB）再细分为 64KB ÷ 4KB = 16 个扇区（Sector0 ~ Sector15，每扇区 4KB = 4096 字节）</text>
  <rect x="60" y="278" width="58" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="5"/>
  <text x="89" y="295" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">Sector0</text>
  <rect x="126" y="278" width="58" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="5"/>
  <text x="155" y="295" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">Sector1</text>
  <rect x="192" y="278" width="58" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="5"/>
  <text x="221" y="295" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">Sector2</text>
  <text x="270" y="295" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">…</text>
  <rect x="290" y="278" width="64" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="5"/>
  <text x="322" y="295" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">Sector14</text>
  <rect x="362" y="278" width="64" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="5"/>
  <text x="394" y="295" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle">Sector15</text>
  <text x="480" y="288" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">最小擦除单元 = 扇区！</text>
  <text x="480" y="301" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">每扇区地址只变低 12 位</text>

  <!-- 箭头 -->
  <line x1="394" y1="312" x2="394" y2="338" stroke="#185FA5" stroke-width="1.5"/>
  <polygon points="394,346 388,336 400,336" fill="#185FA5"/>

  <!-- 第 4 层：页 -->
  <rect x="40" y="348" width="600" height="66" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <text x="340" y="370" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="bold">整个存储空间还会细分为很多页（Page）：每页 256 字节（4KB 扇区 ÷ 256B = 16 页/扇区）</text>
  <rect x="60" y="380" width="58" height="26" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="5"/>
  <text x="89" y="397" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">Page0</text>
  <rect x="126" y="380" width="58" height="26" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="5"/>
  <text x="155" y="397" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">Page1</text>
  <rect x="192" y="380" width="58" height="26" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="5"/>
  <text x="221" y="397" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">Page2</text>
  <text x="270" y="397" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">…</text>
  <rect x="290" y="380" width="64" height="26" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="5"/>
  <text x="322" y="397" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">Page14</text>
  <rect x="362" y="380" width="64" height="26" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="5"/>
  <text x="394" y="397" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">Page15</text>
  <text x="480" y="388" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">单次写时序最多 256B！</text>
  <text x="480" y="401" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">每页地址只变最低 1 个字节</text>

  <!-- 底部：地址分解 -->
  <rect x="40" y="434" width="600" height="104" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="10"/>
  <text x="60" y="458" font-family="sans-serif" font-size="12" fill="#5F5E5A" font-weight="bold">24 位地址 A23~A0 分解（发送顺序：先高字节后低字节）：</text>
  <rect x="60" y="470" width="130" height="40" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="6"/>
  <text x="125" y="488" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" font-weight="bold">A23 ~ A16</text>
  <text x="125" y="503" font-family="sans-serif" font-size="10" fill="#0C447C" text-anchor="middle">块地址（选 Block）</text>
  <rect x="198" y="470" width="130" height="40" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="263" y="488" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" font-weight="bold">A15 ~ A12</text>
  <text x="263" y="503" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">扇区地址（选 Sector）</text>
  <rect x="336" y="470" width="130" height="40" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="401" y="488" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">A11 ~ A8</text>
  <text x="401" y="503" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">页地址（选 Page）</text>
  <rect x="474" y="470" width="140" height="40" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="6"/>
  <text x="544" y="488" font-family="sans-serif" font-size="11" fill="#3C3489" text-anchor="middle" font-weight="bold">A7 ~ A0</text>
  <text x="544" y="503" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">页内字节地址（选字节）</text>
  <text x="60" y="527" font-family="sans-serif" font-size="10.5" fill="#A32D2D" font-weight="bold">记忆要点：页 256B → 扇区 4KB（16 页）→ 块 64KB（16 扇区）→ 整片 8MB（128 块）</text>
</svg>
