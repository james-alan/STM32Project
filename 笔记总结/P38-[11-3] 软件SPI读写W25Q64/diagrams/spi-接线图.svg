<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" role="img">
  <title>软件 SPI 接线图</title>
  <desc>STM32 PA4/PA5/PA6/PA7 与 W25Q64 模块 CS/CLK/DI/DO 的接线图</desc>
  <rect x="0" y="0" width="680" height="440" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">软件 SPI 接线图：STM32F103C8T6 ↔ W25Q64</text>
  <text x="40" y="58" font-family="sans-serif" font-size="11" fill="#5F5E5A">软件模拟 SPI：引脚可任意指定，这里特意接在 SPI1 硬件引脚上，方便日后无缝切换硬件 SPI</text>

  <!-- STM32 芯片 -->
  <rect x="50" y="120" width="180" height="230" fill="#EEEDFE" stroke="#534AB7" stroke-width="2" rx="10"/>
  <text x="140" y="148" font-family="sans-serif" font-size="13" fill="#3C3489" text-anchor="middle" font-weight="bold">STM32F103C8T6</text>
  <text x="140" y="166" font-family="sans-serif" font-size="10.5" fill="#3C3489" text-anchor="middle">（主机 Master）</text>

  <!-- STM32 引脚 -->
  <rect x="70" y="185" width="140" height="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="6"/>
  <text x="140" y="203" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" font-weight="bold">PA4 → CS（片选·推挽输出）</text>
  <rect x="70" y="222" width="140" height="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="6"/>
  <text x="140" y="240" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" font-weight="bold">PA5 → SCK（时钟·推挽输出）</text>
  <rect x="70" y="259" width="140" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="140" y="277" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" font-weight="bold">PA6 ← MISO（输入·上拉）</text>
  <rect x="70" y="296" width="140" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="140" y="314" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" font-weight="bold">PA7 → MOSI（输出·推挽）</text>
  <text x="140" y="338" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">= 硬件 SPI1 默认引脚（NSS/SCK/MISO/MOSI）</text>

  <!-- W25Q64 模块 -->
  <rect x="450" y="120" width="190" height="230" fill="#FAEEDA" stroke="#BA7517" stroke-width="2" rx="10"/>
  <text x="545" y="148" font-family="sans-serif" font-size="13" fill="#854F0B" text-anchor="middle" font-weight="bold">W25Q64 模块</text>
  <text x="545" y="166" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle">（从机 Slave）</text>

  <rect x="470" y="185" width="150" height="26" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="545" y="203" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">CS（片选）</text>
  <rect x="470" y="222" width="150" height="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="6"/>
  <text x="545" y="240" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" font-weight="bold">CLK（时钟）</text>
  <rect x="470" y="259" width="150" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="545" y="277" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" font-weight="bold">DO（从机输出）</text>
  <rect x="470" y="296" width="150" height="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="6"/>
  <text x="545" y="314" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" font-weight="bold">DI（从机输入）</text>

  <!-- 电源 -->
  <rect x="470" y="330" width="150" height="20" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="6"/>
  <text x="545" y="344" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">VCC→3.3V　GND→GND</text>

  <!-- 连线 -->
  <line x1="210" y1="198" x2="470" y2="198" stroke="#534AB7" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="210" y1="235" x2="470" y2="235" stroke="#185FA5" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="210" y1="272" x2="470" y2="272" stroke="#639922" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="210" y1="309" x2="470" y2="309" stroke="#639922" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- 方向标注 -->
  <text x="340" y="191" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">片选（起始/终止）</text>
  <text x="340" y="228" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" text-anchor="middle">时钟（打拍子）</text>
  <text x="340" y="265" font-family="sans-serif" font-size="10.5" fill="#639922" text-anchor="middle">从机数据 → 主机</text>
  <text x="340" y="302" font-family="sans-serif" font-size="10.5" fill="#639922" text-anchor="middle">主机数据 → 从机</text>

  <!-- 底部提示 -->
  <rect x="50" y="385" width="600" height="40" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="70" y="402" font-family="sans-serif" font-size="11" fill="#A32D2D" font-weight="bold">注意：主机三个输出脚（CS/SCK/MOSI）配推挽输出；主机输入脚 MISO（PA6）配上拉输入</text>
  <text x="70" y="417" font-family="sans-serif" font-size="11" fill="#A32D2D">若只想用软件 SPI，接任意 GPIO 都行；但接在硬件 SPI 引脚上可保留日后切换硬件 SPI 的余地</text>

  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#534AB7"/>
    </marker>
  </defs>
</svg>
