<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
  <title>独立看门狗 IWDG 内部结构框图</title>
  <desc>独立看门狗由 LSI 时钟、预分频器、12 位递减计数器、重装载寄存器与键寄存器组成，计数器减到 0 直接产生复位信号</desc>
  <rect x="0" y="0" width="680" height="400" fill="#FAFAFA" rx="12"/>
  <text x="40" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">独立看门狗 IWDG 内部结构（类比定时器时基单元）</text>

  <!-- LSI 时钟 -->
  <rect x="30" y="80" width="120" height="60" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" rx="8"/>
  <text x="90" y="104" font-family="sans-serif" font-size="11.5" fill="#3C3489" text-anchor="middle" font-weight="bold">LSI 时钟</text>
  <text x="90" y="122" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">40kHz</text>
  <text x="90" y="134" font-family="sans-serif" font-size="9" fill="#3C3489" text-anchor="middle">（30~60kHz 波动）</text>

  <!-- 预分频器 -->
  <rect x="200" y="80" width="140" height="60" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="270" y="104" font-family="sans-serif" font-size="11.5" fill="#0C447C" text-anchor="middle" font-weight="bold">8 位预分频器</text>
  <text x="270" y="122" font-family="sans-serif" font-size="10" fill="#0C447C" text-anchor="middle">4~256 分频</text>
  <text x="270" y="134" font-family="sans-serif" font-size="9" fill="#0C447C" text-anchor="middle">PR 寄存器配置</text>

  <!-- 计数器 -->
  <rect x="390" y="80" width="130" height="60" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="8"/>
  <text x="455" y="104" font-family="sans-serif" font-size="11.5" fill="#0C447C" text-anchor="middle" font-weight="bold">12 位递减计数器</text>
  <text x="455" y="122" font-family="sans-serif" font-size="10" fill="#0C447C" text-anchor="middle">初值最大 4095</text>
  <text x="455" y="134" font-family="sans-serif" font-size="9" fill="#0C447C" text-anchor="middle">每来一个时钟减一</text>

  <!-- 复位信号 -->
  <rect x="560" y="80" width="100" height="60" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="610" y="106" font-family="sans-serif" font-size="11.5" fill="#A32D2D" text-anchor="middle" font-weight="bold">复位信号</text>
  <text x="610" y="124" font-family="sans-serif" font-size="9" fill="#A32D2D" text-anchor="middle">计数到 0</text>

  <!-- 箭头 -->
  <line x1="150" y1="110" x2="196" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="110" x2="386" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="110" x2="556" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 重装载寄存器 -->
  <rect x="200" y="210" width="140" height="64" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="270" y="232" font-family="sans-serif" font-size="11.5" fill="#3B6D11" text-anchor="middle" font-weight="bold">重装载寄存器 RLR</text>
  <text x="270" y="250" font-family="sans-serif" font-size="9.5" fill="#3B6D11" text-anchor="middle">喂狗时把 RLR 的值</text>
  <text x="270" y="263" font-family="sans-serif" font-size="9.5" fill="#3B6D11" text-anchor="middle">复制到计数器</text>

  <!-- 键寄存器 -->
  <rect x="390" y="210" width="130" height="84" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="8"/>
  <text x="455" y="232" font-family="sans-serif" font-size="11.5" fill="#854F0B" text-anchor="middle" font-weight="bold">键寄存器 KR</text>
  <text x="455" y="250" font-family="sans-serif" font-size="9.5" fill="#854F0B" text-anchor="middle">0x5555 解除写保护</text>
  <text x="455" y="263" font-family="sans-serif" font-size="9.5" fill="#854F0B" text-anchor="middle">0xAAAA 喂狗</text>
  <text x="455" y="276" font-family="sans-serif" font-size="9.5" fill="#854F0B" text-anchor="middle">0xCCCC 启动</text>

  <!-- 虚线箭头 -->
  <line x1="270" y1="210" x2="270" y2="144" stroke="#639922" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
  <text x="284" y="178" font-family="sans-serif" font-size="9.5" fill="#3B6D11">重装（喂狗）</text>
  <line x1="455" y1="210" x2="455" y2="144" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arro)"/>
  <text x="468" y="178" font-family="sans-serif" font-size="9.5" fill="#854F0B">键值控制</text>

  <!-- 底部说明 -->
  <rect x="30" y="316" width="620" height="66" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="50" y="338" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" font-weight="bold">与定时器时基单元的关键差异：</text>
  <text x="50" y="356" font-family="sans-serif" font-size="10" fill="#5F5E5A">定时器计数到 0 产生更新事件/中断；看门狗计数到 0 直接产生复位信号。</text>
  <text x="50" y="372" font-family="sans-serif" font-size="10" fill="#5F5E5A">定时器在更新事件时自动重装；看门狗必须在计数到 0 之前手动喂狗重装。</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#639922"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#BA7517"/></marker>
  </defs>
</svg>
