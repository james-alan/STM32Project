<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img">
  <title>窗口看门狗 WWDG 喂狗窗口示意</title>
  <desc>喂狗太早计数器高于窗口值会立即复位，喂狗太晚计数器下溢也会复位，只有在窗口值到 0x40 之间喂狗才合法</desc>
  <rect x="0" y="0" width="680" height="420" fill="#FAFAFA" rx="12"/>
  <text x="40" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">窗口看门狗 WWDG：喂狗时机必须落在窗口内</text>

  <!-- 递减趋势线 -->
  <polyline points="80,90 400,170 560,214 620,230" fill="none" stroke="#185FA5" stroke-width="2"/>
  <text x="90" y="82" font-family="sans-serif" font-size="10.5" fill="#0C447C">计数值大（刚喂狗）</text>
  <text x="470" y="196" font-family="sans-serif" font-size="10.5" fill="#0C447C">递减…</text>

  <!-- 三个时间区段 -->
  <rect x="80" y="250" width="320" height="64" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="240" y="274" font-family="sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" font-weight="bold">喂狗太早（禁止刷新）</text>
  <text x="240" y="294" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">此时喂狗：计数值 &gt; 窗口值 → 立即复位</text>

  <rect x="400" y="250" width="160" height="64" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="480" y="274" font-family="sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" font-weight="bold">合法喂狗窗口</text>
  <text x="480" y="294" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">窗口值 ~ 0x40</text>

  <rect x="560" y="250" width="60" height="64" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="590" y="278" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle" font-weight="bold">过晚</text>

  <!-- 边界竖线 -->
  <line x1="400" y1="150" x2="400" y2="320" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="150" x2="560" y2="320" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="620" y1="150" x2="620" y2="320" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 边界标签 -->
  <text x="400" y="148" font-family="sans-serif" font-size="10.5" fill="#A32D2D" text-anchor="middle" font-weight="bold">窗口值 W[6:0]</text>
  <text x="560" y="148" font-family="sans-serif" font-size="10.5" fill="#854F0B" text-anchor="middle" font-weight="bold">0x40（T6 仍为 1）</text>
  <text x="620" y="148" font-family="sans-serif" font-size="10.5" fill="#A32D2D" text-anchor="middle" font-weight="bold">0x3F</text>

  <!-- 早期中断标记 -->
  <rect x="520" y="160" width="80" height="30" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="6"/>
  <text x="560" y="179" font-family="sans-serif" font-size="9.5" fill="#854F0B" text-anchor="middle">等于 0x40</text>
  <text x="560" y="190" font-family="sans-serif" font-size="9" fill="#854F0B" text-anchor="middle">产生 EWI 中断</text>

  <!-- 底部说明 -->
  <rect x="40" y="338" width="600" height="62" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="60" y="358" font-family="sans-serif" font-size="10.5" fill="#5F5E5A" font-weight="bold">关键理解：</text>
  <text x="60" y="376" font-family="sans-serif" font-size="10" fill="#5F5E5A">喂狗太早（计数器仍高于窗口值）→ 与门比较器输出 → 复位；喂狗太晚（计数器下溢，T6 由 1 变 0）→ 复位。</text>
  <text x="60" y="392" font-family="sans-serif" font-size="10" fill="#5F5E5A">早期唤醒中断发生在 0x40，即下溢（0x3F）的前一刻，也叫"死前中断"。</text>
</svg>
