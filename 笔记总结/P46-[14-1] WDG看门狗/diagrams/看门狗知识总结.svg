<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" role="img">
  <title>P46 独立看门狗与窗口看门狗知识总结</title>
  <desc>独立看门狗与窗口看门狗对比：复位条件、时钟、分频、计数器位数、超时范围、喂狗方式、防护操作，以及记忆口诀</desc>
  <rect x="0" y="0" width="680" height="480" fill="#FAFAFA" rx="12"/>
  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">P46 知识总结：独立看门狗 vs 窗口看门狗</text>

  <!-- IWDG 列 -->
  <rect x="40" y="60" width="290" height="232" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" rx="10"/>
  <text x="185" y="86" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">独立看门狗 IWDG</text>
  <line x1="60" y1="98" x2="310" y2="98" stroke="#185FA5" stroke-width="1"/>
  <text x="60" y="118" font-family="sans-serif" font-size="10.5" fill="#0C447C">本质：定时器，计数到 0 直接复位</text>
  <text x="60" y="136" font-family="sans-serif" font-size="10.5" fill="#0C447C">时钟：LSI 40kHz（专用时钟，独立）</text>
  <text x="60" y="154" font-family="sans-serif" font-size="10.5" fill="#0C447C">复位条件：只限制"最晚"（喂太晚）</text>
  <text x="60" y="172" font-family="sans-serif" font-size="10.5" fill="#0C447C">中断：无早期唤醒中断</text>
  <text x="60" y="196" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">分频：4~256 分频（8 位预分频器）</text>
  <text x="60" y="212" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">计数器：12 位（初值最大 4095）</text>
  <text x="60" y="228" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">超时范围：0.1ms ~ 26.2s</text>
  <text x="60" y="244" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">喂狗：键寄存器写 0xAAAA，RLR 重装</text>
  <text x="60" y="260" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">防护：键寄存器 + 写保护（抗干扰强）</text>
  <text x="60" y="280" font-family="sans-serif" font-size="10.5" fill="#A32D2D">场景：独立工作、对时间精度要求低</text>

  <!-- WWDG 列 -->
  <rect x="350" y="60" width="290" height="232" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="10"/>
  <text x="495" y="86" font-family="sans-serif" font-size="13" fill="#3B6D11" text-anchor="middle" font-weight="bold">窗口看门狗 WWDG</text>
  <line x1="370" y1="98" x2="620" y2="98" stroke="#639922" stroke-width="1"/>
  <text x="370" y="118" font-family="sans-serif" font-size="10.5" fill="#3B6D11">本质：定时器，下溢或过早喂狗都复位</text>
  <text x="370" y="136" font-family="sans-serif" font-size="10.5" fill="#3B6D11">时钟：PCLK1（APB1）36MHz</text>
  <text x="370" y="154" font-family="sans-serif" font-size="10.5" fill="#3B6D11">复位条件：喂太早 + 喂太晚都复位</text>
  <text x="370" y="172" font-family="sans-serif" font-size="10.5" fill="#3B6D11">中断：有早期唤醒中断 EWI</text>
  <text x="370" y="196" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">分频：1/2/4/8 分频（WDGTB 配置）</text>
  <text x="370" y="212" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">计数器：低 6 位有效（T6 是标志位）</text>
  <text x="370" y="228" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">超时范围：113μs ~ 58.25ms</text>
  <text x="370" y="244" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">喂狗：直接写计数器（无重装寄存器）</text>
  <text x="370" y="260" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">防护：无键寄存器/写保护设计</text>
  <text x="370" y="280" font-family="sans-serif" font-size="10.5" fill="#A32D2D">场景：要求在精确计数窗口内喂狗</text>

  <!-- 底部口诀 -->
  <rect x="40" y="312" width="600" height="72" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5" rx="8"/>
  <text x="60" y="334" font-family="sans-serif" font-size="11.5" fill="#5F5E5A" font-weight="bold">核心记忆口诀：</text>
  <text x="60" y="354" font-family="sans-serif" font-size="11" fill="#5F5E5A">独立看门狗：0x5555 解保护 → 写分频重装 → 0xCCCC 启动 → 循环喂狗 0xAAAA，只怕喂得晚。</text>
  <text x="60" y="372" font-family="sans-serif" font-size="11" fill="#5F5E5A">窗口看门狗：PCLK1 时钟 → 写分频和窗口值 → 使能同时喂狗 → 窗口内喂狗，喂早喂晚都复位。</text>

  <!-- 底部结论 -->
  <rect x="40" y="398" width="600" height="62" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="60" y="420" font-family="sans-serif" font-size="11" fill="#A32D2D" font-weight="bold">关键提醒：</text>
  <text x="60" y="440" font-family="sans-serif" font-size="11" fill="#A32D2D">两种看门狗一旦启用就无法关闭（除非复位）；LSI 精度差（30~60kHz），计算超时时间要留余量。</text>
  <text x="60" y="456" font-family="sans-serif" font-size="11" fill="#A32D2D">大多数应用用独立看门狗就足够，有更高要求再考虑窗口看门狗。</text>
</svg>
