<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" role="img">
  <title>RTC 预分频与计数器时序图</title>
  <desc>示例 PRL=3（4 分频）：DIV 从 3 递减到 0 后产生秒脉冲并重装载；CNT 在脉冲下降沿 +1；CNT 计满 0xFFFFFFFF 后溢出，置位溢出标志</desc>
  <rect x="0" y="0" width="680" height="440" fill="#FAFAFA" rx="12"/>
  <text x="40" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">RTC 预分频器与计数器时序（PRL = 3，4 分频）</text>
  <text x="40" y="56" font-family="sans-serif" font-size="11" fill="#5F5E5A">DIV 递减到 0 产生秒脉冲 → CNT 在脉冲下降沿 +1 → CNT 计满溢出产生溢出标志</text>

  <!-- 波形区 -->
  <!-- RTCCLK 波形（8 个周期） -->
  <text x="60" y="108" font-family="sans-serif" font-size="12" fill="#0C447C" font-weight="bold">RTCCLK</text>
  <line x1="130" y1="104" x2="620" y2="104" stroke="#D3D1C7" stroke-width="1"/>
  <g stroke="#0C447C" stroke-width="2" fill="none">
    <polyline points="130,92 150,92 150,104 170,104 170,92 190,92 190,104 210,104 210,92 230,92 230,104 250,104 250,92 270,92 270,104 290,104 290,92 310,92 310,104 330,104 330,92 350,92 350,104 370,104 370,92 390,92 390,104 410,104 410,92 430,92 430,104 450,104 450,92 470,92 470,104 490,104 490,92 510,92 510,104 530,104 530,92 550,92 550,104 570,104 570,92 590,92 590,104 610,104"/>
  </g>

  <!-- PR 重装载值 = 3 恒不变 -->
  <text x="60" y="148" font-family="sans-serif" font-size="12" fill="#5F5E5A" font-weight="bold">PR(重装载)</text>
  <text x="300" y="148" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="bold">3</text>
  <line x1="130" y1="156" x2="620" y2="156" stroke="#D3D1C7" stroke-width="1"/>
  <line x1="290" y1="160" x2="290" y2="172" stroke="#5F5E5A" stroke-width="1"/>
  <text x="290" y="168" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">← 保持 3 不变</text>

  <!-- DIV 递减 3,2,1,0 -->
  <text x="60" y="196" font-family="sans-serif" font-size="12" fill="#854F0B" font-weight="bold">DIV(余数)</text>
  <line x1="130" y1="192" x2="620" y2="192" stroke="#D3D1C7" stroke-width="1"/>
  <text x="150" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">3</text>
  <text x="210" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">2</text>
  <text x="270" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">1</text>
  <text x="330" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">0</text>
  <text x="390" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">3</text>
  <text x="450" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">2</text>
  <text x="510" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">1</text>
  <text x="570" y="214" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" font-weight="bold">0</text>
  <line x1="130" y1="200" x2="130" y2="220" stroke="#854F0B" stroke-width="1"/>
  <line x1="190" y1="200" x2="190" y2="220" stroke="#854F0B" stroke-width="1"/>
  <line x1="250" y1="200" x2="250" y2="220" stroke="#854F0B" stroke-width="1"/>
  <line x1="310" y1="200" x2="310" y2="220" stroke="#854F0B" stroke-width="1"/>
  <line x1="370" y1="200" x2="370" y2="220" stroke="#854F0B" stroke-width="1"/>
  <line x1="430" y1="200" x2="430" y2="220" stroke="#854F0B" stroke-width="1"/>
  <line x1="490" y1="200" x2="490" y2="220" stroke="#854F0B" stroke-width="1"/>
  <line x1="550" y1="200" x2="550" y2="220" stroke="#854F0B" stroke-width="1"/>

  <!-- 秒脉冲 -->
  <text x="60" y="252" font-family="sans-serif" font-size="12" fill="#3B6D11" font-weight="bold">秒脉冲</text>
  <line x1="130" y1="248" x2="620" y2="248" stroke="#D3D1C7" stroke-width="1"/>
  <g stroke="#3B6D11" stroke-width="2" fill="none">
    <polyline points="130,240 320,240 320,244 360,256 360,240 610,240"/>
  </g>
  <text x="360" y="272" font-family="sans-serif" font-size="10.5" fill="#3B6D11" text-anchor="middle" font-weight="bold">DIV 减到 0 时产生 + 重装载</text>

  <!-- CNT 计数 -->
  <text x="60" y="310" font-family="sans-serif" font-size="12" fill="#185FA5" font-weight="bold">CNT(秒)</text>
  <line x1="130" y1="306" x2="620" y2="306" stroke="#D3D1C7" stroke-width="1"/>
  <text x="390" y="330" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" font-weight="bold">+1（脉冲下降沿）</text>
  <line x1="355" y1="312" x2="355" y2="330" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 溢出说明 -->
  <rect x="130" y="356" width="500" height="56" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="380" y="378" font-family="sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle" font-weight="bold">CNT 计到 0xFFFFFFFF 后继续 +1 → 溢出</text>
  <text x="380" y="398" font-family="sans-serif" font-size="10.5" fill="#A32D2D" text-anchor="middle">产生溢出标志（可触发溢出中断）；中断处理函数中软件清除标志位</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
</svg>
